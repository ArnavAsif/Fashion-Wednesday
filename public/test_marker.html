<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <style>
    body { background: #fff9f7; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .btn { position: relative; font-size: 2rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; padding: 10px 20px; }
    .marker-container { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div class="btn">
    <span>[ SELECT SIZE ]</span>
    <div id="marker" class="marker-container"></div>
  </div>
  <script>
    const anim = lottie.loadAnimation({
      container: document.getElementById('marker'),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      path: '/lottie/LOTTIE_MARKER_v1.json'
    });
    anim.addEventListener('DOMLoaded', () => {
      anim.goToAndStop(15, true); // Middle frame of the marker
      window.loaded = true;
    });
  </script>
</body>
</html>
